name: CI

on:
  push:
    branches: [ main, develop, 'release/**' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  # ─── Build & Test (Ubuntu) ─────────────────────────────────────────────────
  build-ubuntu:
    name: Build & Test (Ubuntu ${{ matrix.ubuntu }}, ${{ matrix.build_type }})
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            libgtk-3-dev \
            libsqlite3-dev \
            libssl-dev \
            uuid-dev \
            pkg-config \
            librsvg2-bin \
            desktop-file-utils \
            appstream

      - name: Configure
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DSDO_BUILD_TESTS=ON \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests (headless via Xvfb)
        run: |
          sudo apt-get install -y xvfb
          # FileWatcher and core tests don't need display
          cd build
          ctest --output-on-failure \
                --exclude-regex ".*gui.*" \
                --timeout 60

      - name: Validate desktop file
        run: |
          desktop-file-validate \
            resources/com.sdo.organizer.desktop

      - name: Validate AppStream metadata
        run: |
          appstream-util validate-relax \
            resources/com.sdo.organizer.appdata.xml || true

      - name: Upload build artifacts
        if: matrix.build_type == 'Release' && matrix.ubuntu == '24.04'
        uses: actions/upload-artifact@v4
        with:
          name: sdo-ubuntu-${{ matrix.ubuntu }}-binary
          path: build/bin/sdo
          retention-days: 7

  # ─── Build (Fedora) ────────────────────────────────────────────────────────
  build-fedora:
    name: Build & Test (Fedora Latest)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            cmake ninja-build gcc-c++ \
            gtk3-devel \
            sqlite-devel \
            openssl-devel \
            libuuid-devel \
            pkgconfig \
            librsvg2-tools

      - name: Configure & Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDO_BUILD_TESTS=ON
          cmake --build build --parallel

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure --timeout 60

  # ─── Static analysis ──────────────────────────────────────────────────────
  static-analysis:
    name: Clang-Tidy Static Analysis
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build clang clang-tidy \
            libgtk-3-dev libsqlite3-dev libssl-dev uuid-dev

      - name: Configure with clang
        env:
          CC:  clang
          CXX: clang++
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DSDO_BUILD_TESTS=OFF

      - name: Run clang-tidy
        run: |
          run-clang-tidy -p build \
            -header-filter='include/.*' \
            $(find src -name '*.cpp' | grep -v app_window) \
            2>&1 | tee clang-tidy-report.txt
          # Fail on errors, allow warnings
          ! grep -q "error:" clang-tidy-report.txt

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: clang-tidy-report.txt

  # ─── Address Sanitizer build ──────────────────────────────────────────────
  asan:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            libgtk-3-dev libsqlite3-dev libssl-dev uuid-dev

      - name: Configure (Debug + ASAN)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSDO_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests under ASAN
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cd build
          ctest --output-on-failure --timeout 120

  # ─── CPack packaging ──────────────────────────────────────────────────────
  package:
    name: Create Packages
    runs-on: ubuntu-24.04
    needs: [build-ubuntu]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            libgtk-3-dev libsqlite3-dev libssl-dev uuid-dev \
            librsvg2-bin

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDO_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Create packages
        run: |
          cd build
          cpack -G DEB
          cpack -G TGZ

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: build/*.deb
          retention-days: 30
